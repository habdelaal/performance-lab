name: R054 current versus deferred tracking
on:
  push:
    branches: [qa/r053-browser]
    paths: ['tools/r054/**', '.github/workflows/r054-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r054-performance
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/qa/r053-browser'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Install pinned Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: '145.0.7632.117'
      - name: Install locked dependencies
        working-directory: tools/r052
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Five alternating mobile pairs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/r054/compare.mjs
      - name: Preserve reports including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r054-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/r054/reports/
          if-no-files-found: warn
          retention-days: 14
