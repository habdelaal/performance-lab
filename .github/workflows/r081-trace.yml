name: R081 PSI matched Lighthouse capture
on:
  push:
    branches: [qa/r053-browser]
    paths: ['tools/r081/**', '.github/workflows/r081-trace.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r081-events
  cancel-in-progress: false
jobs:
  browser:
    if: github.ref == 'refs/heads/qa/r053-browser'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install pinned Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: '153.0.8010.36'
      - name: Install existing locked browser dependencies
        working-directory: tools/r081
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated HTML parser
        run: python3 -m pip install --target=/tmp/r081-python lxml==5.2.1
      - name: Capture rendering and JavaScript traces
        env:
          PYTHONPATH: /tmp/r081-python
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/r081/measure.mjs
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r081-events-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/r081/reports/
          if-no-files-found: warn
          retention-days: 7


